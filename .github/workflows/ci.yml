name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop
      - test
      - main
    types:
      - closed

jobs:
  deploy:
    runs-on: ubuntu-latest

    if: |
      (github.event_name == 'push' && github.ref_name == 'develop') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (github.base_ref == 'develop' || github.base_ref == 'test' || github.base_ref == 'main'))

    environment:
      name: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.0

      - name: Debug env
        run: |
          echo "ENV: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"

      - name: Install dependencies
        run: bun install

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: bun run build

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy dist --branch ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
